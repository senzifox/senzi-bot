services:
  bot:
    build: .
    container_name: senzi-bot
    restart: unless-stopped
    depends_on:
      - redis
      - telegram-bot-api
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    container_name: senzi-bot-worker
    command: arq bot.worker.WorkerSettings
    restart: unless-stopped
    depends_on:
      - redis
      - telegram-bot-api
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: senzi-bot-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: senzi-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  redis-data:
  telegram-bot-api-data:
